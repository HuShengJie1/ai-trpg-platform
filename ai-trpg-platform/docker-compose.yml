# Optional local stack for future shared development, deployment, pgvector checks,
# or multi-developer environments. Early MVP development can use local PostgreSQL.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-trpg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_trpg
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
